<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiDAR Placement Workbench</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#222;background:#f5f7f8;letter-spacing:0}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ccd3d7;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:300px 1fr;min-height:85vh}aside{padding:20px;background:white;border-right:1px solid #ccd3d7}section{padding:16px;min-width:0}label{display:block;margin:12px 0 5px}select,input[type=number],button{padding:8px;border:1px solid #b8c3c8;border-radius:4px;max-width:100%}select{width:100%}input[type=range]{width:100%;accent-color:#008978}button{background:#fff;cursor:pointer}button.primary{background:#007c6b;color:white;border:0}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid input{width:100%}.weights output{float:right;color:#007c6b}#plot{height:65vh;min-height:350px;background:white}#status{padding:10px 0;color:#536268;overflow-wrap:anywhere}#metrics{display:flex;gap:28px;flex-wrap:wrap;padding:10px 0 20px}#metrics strong{font-size:23px;display:block}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:right;padding:8px;border-bottom:1px solid #ddd}#tablewrap{overflow:auto}small{color:#66757c}#file{max-width:100%}@media(max-width:760px){main{grid-template-columns:1fr}aside{border-right:0}#plot{height:55vh}header{padding:12px}h1{font-size:17px}}
main{grid-template-columns:300px minmax(0,1fr)}header{gap:12px;flex-wrap:wrap}#plot{width:100%;overflow:hidden}aside{min-width:0}@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}}
fieldset{border:0;padding:0;margin:16px 0}legend{font-weight:600}h2{font-size:17px;margin-top:24px}.tablewrap{overflow:auto}#comparison{height:320px;min-width:0}#comparisonRows tr:has(input:checked){background:#e4f3ef}#comparisonRows td:last-child{max-width:220px;overflow-wrap:anywhere}#chartMetric{max-width:280px}#stop{margin-top:8px}.methodOptions{border-top:1px solid #ccd3d7;padding-top:10px;margin-top:22px}.methodOptions legend{padding-right:8px;color:#28564e}#resultFilters{border-bottom:1px solid #ccd3d7;padding-bottom:12px}#resultFilters label{margin:8px 8px 8px 0}#chartType{max-width:240px}#chartCount{color:#536268}</style>
<header><h1>LiDAR Placement Workbench</h1><button id="download" disabled>결과 JSON 다운로드</button></header>
<main><aside>
<label for="mode">입력</label><select id="mode"><option value="robot">플랫폼 · Box 예제</option><option value="roadside">도로 · Parametric 예제</option><option value="custom">사용자 Mesh JSON</option></select>
<label for="scenario">도로 시나리오</label><select id="scenario"><option>0</option><option>1</option><option>2</option><option>3</option><option>6</option><option>9</option></select>
<label for="file">사용자 지도 / 플랫폼 파일</label><input id="file" type="file" accept=".json">
<p><button class="primary" id="load">환경 불러오기</button></p>
<fieldset><legend>비교 알고리즘</legend><label><input type="checkbox" name="method" value="greedy" checked> GREEDY</label><label><input type="checkbox" name="method" value="milp"> MILP</label><label><input type="checkbox" name="method" value="mappo"> MAPPO · 새 학습</label></fieldset>
<fieldset id="greedyOptions" class="methodOptions"><legend>GREEDY · 선택 설정</legend><label for="greedy_steps">최대 선택 단계</label><input id="greedy_steps" type="number" min="0" max="100" step="1" value="100"></fieldset>
<fieldset id="milpOptions" hidden class="methodOptions"><legend>MILP · 풀이 설정</legend><label for="milp_seconds">풀이 제한시간 (초)</label><input id="milp_seconds" type="number" min="1" max="3600" value="30"><label for="milp_gap">허용 상대 MIP gap</label><input id="milp_gap" type="number" min="0" max="1" step="0.01" value="0.05"></fieldset>
<fieldset id="mappoOptions" hidden class="methodOptions"><legend>MAPPO · 학습 설정</legend><label for="mappo_steps">학습 단계 (공동 배치 시도)</label><input id="mappo_steps" type="number" min="32" max="20000" step="1" value="1000"><label for="seed">Seed</label><input id="seed" type="number" min="0" max="4294967295" step="1" value="0"></fieldset>
<label for="budgetMode">센서 예산</label><select id="budgetMode"><option value="single">단일 K</option><option value="range">K 범위</option></select><label for="budget">K / 시작 K</label><input id="budget" type="number" min="0" max="100" step="1" value="1"><div id="rangeOptions" hidden><label for="budgetEnd">종료 K</label><input id="budgetEnd" type="number" min="0" max="100" step="1" value="3"></div>
<div class="weights" id="weights"></div>
<label><input id="regionOn" type="checkbox"> 중요 영역 (XY)</label>
<div class="grid"><label>X 최소<input id="xmin" type="number" value="0"></label><label>Y 최소<input id="ymin" type="number" value="0"></label><label>X 최대<input id="xmax" type="number" value="50"></label><label>Y 최대<input id="ymax" type="number" value="50"></label></div>
<label for="factor">영역 중요도 배수</label><input id="factor" type="number" min="0" value="3">
<p id="plan"></p><p><button id="solve" class="primary" disabled>선택 조합 실행</button> <button id="stop" hidden>남은 조합 중단</button></p>
</aside><section><div id="status" role="status">환경 대기</div><fieldset id="resultFilters"><legend>결과 그래프 선택</legend><div id="methodFilters" class="row"></div><div id="kFilters" class="row"></div><div class="row"><button id="selectAllResults">전체 선택</button><button id="clearResults">선택 해제</button><span id="chartCount"></span></div></fieldset><label for="chartType">그래프 형식</label><select id="chartType"><option value="bar">묶음 막대</option><option value="scatter">K별 선 그래프</option></select><label for="chartMetric">비교 지표</label><select id="chartMetric"><option value="coverage_pct">Coverage (%)</option><option value="overlap_pct">중복 관측 target (%)</option><option value="uncovered_pct">미관측 target (%)</option><option value="objective_score">가중 목적값</option></select><div id="comparison"></div><div class="tablewrap"><table><thead><tr><th>그래프</th><th>지도</th><th>알고리즘</th><th>예산 K</th><th>설치 수</th><th>Coverage %</th><th>중복 %</th><th>미관측 %</th><th>미관측 수</th><th>목적값</th><th>상태</th></tr></thead><tbody id="comparisonRows"></tbody></table></div><h2 id="selectedTitle">배치 결과</h2><div id="metrics"></div><div id="plot"></div><p><small id="source"></small></p><div id="tablewrap"><table><thead><tr><th>LiDAR</th><th>X</th><th>Y</th><th>Z</th><th>Yaw</th><th>Pitch</th></tr></thead><tbody id="poses"></tbody></table></div></section></main>
<script src="/plotly.js"></script><script src="/static/workbench.js"></script></html>
